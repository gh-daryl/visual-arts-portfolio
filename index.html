<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Arts Portfolio | GE ELEC 3 - Masterpiece</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="book-wrapper">
        <div class="book-container">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="book-content" id="bookContent"></div>
            <div class="nav-controls">
                <button class="nav-btn" id="prevBtn"><i class="fas fa-chevron-left"></i> Previous</button>
                <div class="center-controls">
                    <div class="page-indicator">
                        <i class="fas fa-book-open"></i>
                        <span id="currentPageNum">1</span> / <span id="totalPagesNum">15</span>
                    </div>
                    <button class="icon-btn" id="themeToggle" title="Dark / Light mode"><i class="fas fa-moon"></i></button>
                </div>
                <button class="nav-btn" id="nextBtn">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-img" id="lightboxImg" alt="Full size artwork">
    </div>
    <canvas id="fireworksCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>
    <script src="js/app.js"></script>
</body>
</html>
